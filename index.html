<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<title>SuperEnalotto LAB 6</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f3f4f6;color:#111827;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:24px 0 28px}.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:28px;margin:0 0 8px}.sub{color:#6b7280;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.num{border:0;background:#e5e7eb;border-radius:12px;aspect-ratio:1;color:#111827;font-size:16px;font-weight:700}.num.sel{background:#111827;color:#fff}.num:active{transform:scale(.96)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.result{margin-top:18px;background:#f9fafb;border-radius:18px;padding:16px;text-align:center}.balls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.ball{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#111827;color:#fff;font-weight:800;font-size:17px}
.hint{font-size:13px;color:#6b7280;line-height:1.45;margin-top:18px}.count{text-align:center;font-weight:700;margin:14px 0 8px}
footer{text-align:center;color:#9ca3af;font-size:11px;margin-top:16px}
@media(max-width:360px){.grid{gap:6px}.num{font-size:14px}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>SuperEnalotto LAB 6</h1>
<p class="sub">Seleziona 6 numeri oppure lascia che LAB 6 li generi.</p>
<div class="count" id="count">0 / 6 selezionati</div>
<div class="grid" id="grid"></div>
<div class="actions">
<button class="btn primary" id="generate">Genera combinazione</button>
<button class="btn secondary" id="reset">Azzera</button>
</div>
<div class="result">
<strong>Combinazione</strong>
<div class="balls" id="result"><span style="color:#9ca3af">—</span></div>
</div>
<p class="hint">Per installarla su iPhone: Safari → Condividi → Aggiungi alla schermata Home. Le combinazioni sono casuali e non prevedono i risultati delle estrazioni.</p>
</section>
<footer>SuperEnalotto LAB 6</footer>
</main>
<script>
const grid=document.getElementById("grid"),count=document.getElementById("count"),result=document.getElementById("result");
let selected=new Set();
for(let n=1;n<=90;n++){
 const b=document.createElement("button");b.className="num";b.textContent=n;
 b.addEventListener("click",()=>{if(selected.has(n)){selected.delete(n);b.classList.remove("sel")}else if(selected.size<6){selected.add(n);b.classList.add("sel")}update()});
 grid.appendChild(b);
}
function update(){count.textContent=selected.size+" / 6 selezionati"}
function show(nums){result.innerHTML=nums.map(n=>'<span class="ball">'+n+'</span>').join("")}
document.getElementById("generate").addEventListener("click",()=>{
 let a=Array.from(selected);
 if(a.length<6){a=Array.from({length:90},(_,i)=>i+1).sort(()=>Math.random()-.5).slice(0,6)}
 a.sort((x,y)=>x-y);show(a);
});
document.getElementById("reset").addEventListener("click",()=>{
 selected.clear();document.querySelectorAll(".num").forEach(b=>b.classList.remove("sel"));update();result.innerHTML='<span style="color:#9ca3af">—</span>';
});
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body>
</html>
